openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Qodia account, onboarding, progress, and learning-session API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account and session authentication
  - name: learning
    description: Student setup and learning progress
  - name: defense
    description: Final-defense simulations and readiness summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding:
    patch:
      operationId: completeOnboarding
      tags: [learning]
      summary: Save graduation-project details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learning-map:
    get:
      operationId: getLearningMap
      tags: [learning]
      summary: Get or lazily create the authenticated student's learning map
      responses:
        "200":
          description: Personalized 30-concept learning map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMap"
        "400":
          description: Project profile is incomplete or map generation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-learning-map:
    post:
      operationId: generateLearningMap
      tags: [learning]
      summary: Ensure the authenticated student has an idempotently generated learning map
      responses:
        "200":
          description: Existing or newly generated learning map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMap"
        "400":
          description: Project profile is incomplete or map generation is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /update-mastery:
    post:
      operationId: updateMastery
      tags: [learning]
      summary: Verify a completed session and return its persisted learning map
      description: Mastery is calculated atomically when the session is saved; this endpoint only verifies its owner and completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasteryUpdateInput"
      responses:
        "200":
          description: Updated learning map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMap"
        "400":
          description: Invalid session identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not belong to the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session has not been completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [learning]
      summary: Get progress, streak, and recent learning sessions
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pride-moment:
    get:
      operationId: getPrideMoment
      summary: Read the learner's completed-session count and saved-code milestone
      parameters:
        - in: query
          name: session_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private, read-only milestone data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrideMoment"
        "404":
          description: Completed session not found
  /sessions:
    get:
      operationId: getSessions
      tags: [learning]
      summary: List the signed-in user's recent learning sessions
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSession
      tags: [learning]
      summary: Save completed touches and award XP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Current generated lesson or its required project-file draft does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-session:
    get:
      operationId: getGeneratedSession
      tags: [learning]
      summary: Get the signed-in student's cached daily learning session
      responses:
        "200":
          description: Cached or newly generated learning session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Project profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createGeneratedSession
      tags: [learning]
      summary: Generate a fresh session using a different concept and replace today's cache
      responses:
        "200":
          description: Fresh learning session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Project profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /touch4-support:
    get:
      operationId: getTouch4Support
      tags: [learning]
      summary: Get persisted Touch 4 attempts and already revealed help
      parameters:
        - name: lesson_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current Touch 4 support state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Touch4Support" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Lesson not found or already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /touch4-support/activity:
    post:
      operationId: updateTouch4Activity
      tags: [learning]
      summary: Record typing or check idle hint availability using server time
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Touch4ActivityInput" }
      responses:
        "200":
          description: Current hint availability without revealing help or charging XP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Touch4Support" }
        "400":
          description: Invalid activity request
        "401":
          description: Authentication required
        "404":
          description: Lesson unavailable
  /touch4-support/reveal:
    post:
      operationId: revealTouch4Hint
      tags: [learning]
      summary: Reveal an eligible progressive hint or reference solution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Touch4SupportRevealInput" }
      responses:
        "200":
          description: Updated Touch 4 support state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Touch4Support" }
        "400":
          description: Invalid reveal request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Lesson not found or already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Hint is still locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Generated lesson support is temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /project-structure:
    get:
      operationId: getProjectStructure
      tags: [learning]
      summary: Get the student's cumulative project plan and saved file contents
      description: Previously learned concepts may inform the plan, but files from historical sessions remain planned unless their code was explicitly saved.
      responses:
        "200":
          description: Project structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStructure"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Project profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /project-verification:
    get:
      operationId: getProjectVerification
      tags: [learning]
      summary: Safely check syntax of saved student files without executing project code
      responses:
        "200":
          description: Syntax check result; passing does not imply a successful build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVerification"
        "400":
          description: Incomplete project profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /project-export:
    get:
      operationId: exportProject
      tags: [learning]
      summary: Download saved project files and labeled framework scaffolding
      responses:
        "200":
          description: ZIP of the authenticated student's saved project
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No saved files yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /save-file:
    post:
      operationId: saveProjectFile
      tags: [learning]
      summary: Save a built project file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileInput"
      responses:
        "200":
          description: Saved project file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPlanFile"
        "422":
          description: Student code did not pass progressive validation; nothing saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid file input or project profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: File is complete or the submitted content conflicts with the saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /defense/start:
    post:
      operationId: startDefense
      tags: [defense]
      summary: Start an eligible final-defense simulation
      responses:
        "201":
          description: New simulation with private grading keys withheld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "400":
          description: Student is not eligible or has no saved complete project files
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: An active simulation already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/submit-answer:
    post:
      operationId: submitDefenseAnswer
      tags: [defense]
      summary: Lock an answer and evaluate the immutable submission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefenseAnswerInput" }
      responses:
        "200":
          description: Persisted answer and evaluation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "400":
          description: Invalid answer request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Simulation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Answer is locked, changed on retry, or question is not current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/complete:
    post:
      operationId: completeDefense
      tags: [defense]
      summary: Complete a fully evaluated simulation idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefenseIdInput" }
      responses:
        "200":
          description: Completed result and private grading material released to owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Simulation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: All questions must be scored before completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/summary:
    get:
      operationId: getDefenseSummary
      tags: [defense]
      summary: Get authenticated student's eligibility and actual simulation history
      responses:
        "200":
          description: Readiness and defense-attempt summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSummary" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/{id}:
    get:
      operationId: getDefense
      tags: [defense]
      summary: Resume or inspect an owned simulation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Simulation state with only safely releasable grading data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Simulation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/{id}/advance:
    post:
      operationId: advanceDefense
      tags: [defense]
      summary: Advance after the current question has been scored
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current question advanced with a fresh server deadline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Simulation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Current answer is not yet scored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/{id}/abandon:
    post:
      operationId: abandonDefense
      tags: [defense]
      summary: Abandon an active simulation without fabricating an overall score
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Abandoned simulation with honest partial results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Simulation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /defense/{id}/draft:
    patch:
      operationId: saveDefenseDraft
      tags: [defense]
      summary: Save the current unlocked question's draft before its deadline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefenseDraftInput" }
      responses:
        "200":
          description: Draft saved and simulation returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefenseSimulation" }
        "400":
          description: Invalid draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Simulation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Question is locked, stale, or deadline has elapsed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  schemas:
    PrideCodeSnippet:
      type: object
      required: [path, preview, line_count, day, modified_since_creation]
      properties:
        path:
          type: string
        preview:
          type: string
        line_count:
          type: integer
          minimum: 0
        day:
          type: integer
          minimum: 1
        modified_since_creation:
          type: boolean
    PrideComparison:
      type: object
      required: [first, latest]
      properties:
        first:
          $ref: "#/components/schemas/PrideCodeSnippet"
        latest:
          $ref: "#/components/schemas/PrideCodeSnippet"
    PrideMoment:
      type: object
      required: [completed_sessions_count, comparison]
      properties:
        completed_sessions_count:
          type: integer
          minimum: 0
        comparison:
          anyOf:
            - $ref: "#/components/schemas/PrideComparison"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        validation:
          $ref: "#/components/schemas/CodeValidationResult"
      required: [error]
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    TechStack:
      type: string
      enum: [Django, Node.js, React, Flutter]
    SecondaryTechStack:
      type: string
      enum: [React, Vue, Flutter, Django, Node.js, Other]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        project_name:
          type: ["string", "null"]
        tech_stack:
          anyOf:
            - $ref: "#/components/schemas/TechStack"
            - type: "null"
        secondary_tech_stack:
          anyOf:
            - $ref: "#/components/schemas/SecondaryTechStack"
            - type: "null"
        created_at:
          type: string
          format: date-time
      required: [id, email, name, project_name, tech_stack, created_at]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    SignUpInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
      required: [email, password, name]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [email, password]
    OnboardingInput:
      type: object
      properties:
        project_name:
          type: string
          minLength: 1
          maxLength: 120
        tech_stack:
          $ref: "#/components/schemas/TechStack"
        secondary_tech_stack:
          anyOf:
            - $ref: "#/components/schemas/SecondaryTechStack"
            - type: "null"
      required: [project_name, tech_stack]
    SessionInput:
      type: object
      properties:
        concept:
          type: string
          minLength: 1
          maxLength: 250
        concept_name_en:
          type: string
          minLength: 1
          maxLength: 100
        touches_completed:
          type: integer
          minimum: 0
          maximum: 5
        mistakes:
          type: integer
          minimum: 0
        xp_earned:
          type: integer
          minimum: 0
        concept_id:
          type: string
          minLength: 1
          maxLength: 100
        lesson_id:
          type: string
          format: uuid
        touches_correct:
          type: integer
          minimum: 0
          maximum: 5
        completion_time:
          type: number
          minimum: 0
        build_passed:
          type: boolean
      required: [concept, concept_name_en, touches_completed, mistakes, xp_earned]
    MasteryUpdateInput:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
      required: [session_id]
    LearningConcept:
