openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Qodia account, onboarding, progress, and learning-session API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account and session authentication
  - name: learning
    description: Student setup and learning progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding:
    patch:
      operationId: completeOnboarding
      tags: [learning]
      summary: Save graduation-project details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [learning]
      summary: Get progress, streak, and recent learning sessions
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sessions:
    get:
      operationId: getSessions
      tags: [learning]
      summary: List the signed-in user's recent learning sessions
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSession
      tags: [learning]
      summary: Save completed touches and award XP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate-session:
    get:
      operationId: getGeneratedSession
      tags: [learning]
      summary: Get the signed-in student's cached daily learning session
      responses:
        "200":
          description: Cached or newly generated learning session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Project profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createGeneratedSession
      tags: [learning]
      summary: Generate a fresh session using a different concept and replace today's cache
      responses:
        "200":
          description: Fresh learning session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Project profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    TechStack:
      type: string
      enum: [Django, Node.js, React, Flutter]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        project_name:
          type: ["string", "null"]
        tech_stack:
          anyOf:
            - $ref: "#/components/schemas/TechStack"
            - type: "null"
        created_at:
          type: string
          format: date-time
      required: [id, email, name, project_name, tech_stack, created_at]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    SignUpInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
      required: [email, password, name]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [email, password]
    OnboardingInput:
      type: object
      properties:
        project_name:
          type: string
          minLength: 1
          maxLength: 120
        tech_stack:
          $ref: "#/components/schemas/TechStack"
      required: [project_name, tech_stack]
    SessionInput:
      type: object
      properties:
        concept:
          type: string
          minLength: 1
          maxLength: 160
        touches_completed:
          type: integer
          minimum: 0
          maximum: 5
        mistakes:
          type: integer
          minimum: 0
        xp_earned:
          type: integer
          minimum: 0
      required: [concept, touches_completed, mistakes, xp_earned]
    LearningSession:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        concept:
          type: string
        touches_completed:
          type: integer
        mistakes:
          type: integer
        xp_earned:
          type: integer
        timestamp:
          type: string
          format: date-time
      required: [id, user_id, concept, touches_completed, mistakes, xp_earned, timestamp]
    Progress:
      type: object
      properties:
        total_xp:
          type: integer
        level:
          type: integer
        streak_days:
          type: integer
        last_active:
          type: ["string", "null"]
          format: date
      required: [total_xp, level, streak_days, last_active]
    Dashboard:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        progress:
          $ref: "#/components/schemas/Progress"
        recent_sessions:
          type: array
          items:
            $ref: "#/components/schemas/LearningSession"
        onboarding_complete:
          type: boolean
      required: [user, progress, recent_sessions, onboarding_complete]
    GeneratedSession:
      type: object
      additionalProperties: false
      properties:
        concept_name_en:
          type: string
          minLength: 1
          maxLength: 100
        concept_name_ar:
          type: string
          minLength: 1
          maxLength: 140
        concept_intro:
          type: string
          minLength: 1
          maxLength: 400
        source:
          type: string
          enum: [gemini, fallback]
        touch1_provoke:
          $ref: "#/components/schemas/GeneratedTouch1"
        touch2_reveal:
          $ref: "#/components/schemas/GeneratedTouch2"
        touch3_explore:
          $ref: "#/components/schemas/GeneratedTouch3"
        touch4_build:
          $ref: "#/components/schemas/GeneratedTouch4"
        touch5_defend:
          $ref: "#/components/schemas/GeneratedTouch5"
      required: [concept_name_en, concept_name_ar, concept_intro, source, touch1_provoke, touch2_reveal, touch3_explore, touch4_build, touch5_defend]
    GeneratedTouch1:
      type: object
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        options: { type: array, minItems: 2, maxItems: 3, items: { type: string, minLength: 1, maxLength: 300 } }
        correct_index: { type: integer, minimum: 0, maximum: 2 }
        feedback_correct: { type: string, minLength: 1, maxLength: 400 }
        feedback_wrong: { type: string, minLength: 1, maxLength: 400 }
      required: [question, options, correct_index, feedback_correct, feedback_wrong]
    GeneratedTouch2:
      type: object
      additionalProperties: false
      properties:
        explanation: { type: string, minLength: 1, maxLength: 1200 }
        values_table:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            properties:
              code: { type: string, minLength: 1, maxLength: 160 }
              meaning: { type: string, minLength: 1, maxLength: 400 }
            required: [code, meaning]
        verification_question: { type: string, minLength: 1, maxLength: 500 }
        verification_options: { type: array, minItems: 2, maxItems: 3, items: { type: string, minLength: 1, maxLength: 300 } }
        correct_index: { type: integer, minimum: 0, maximum: 2 }
        feedback_correct: { type: string, minLength: 1, maxLength: 400 }
        feedback_wrong: { type: string, minLength: 1, maxLength: 400 }
      required: [explanation, values_table, verification_question, verification_options, correct_index, feedback_correct, feedback_wrong]
    GeneratedTouch3:
      type: object
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        options: { type: array, minItems: 2, maxItems: 3, items: { type: string, minLength: 1, maxLength: 300 } }
        correct_index: { type: integer, minimum: 0, maximum: 2 }
        feedback_correct: { type: string, minLength: 1, maxLength: 400 }
        feedback_wrong: { type: string, minLength: 1, maxLength: 400 }
      required: [question, options, correct_index, feedback_correct, feedback_wrong]
    GeneratedTouch4:
      type: object
      additionalProperties: false
      properties:
        task_description: { type: string, minLength: 1, maxLength: 700 }
        starter_code: { type: string, minLength: 1, maxLength: 2000 }
        expected_keywords: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 1, maxLength: 80 } }
        success_message: { type: string, minLength: 1, maxLength: 400 }
        hint: { type: string, minLength: 1, maxLength: 400 }
        code_placeholder: { type: string, minLength: 1, maxLength: 200 }
      required: [task_description, starter_code, expected_keywords, success_message, hint, code_placeholder]
    GeneratedTouch5:
      type: object
      additionalProperties: false
      properties:
        committee_question: { type: string, minLength: 1, maxLength: 700 }
        options: { type: array, minItems: 2, maxItems: 3, items: { type: string, minLength: 1, maxLength: 400 } }
        correct_index: { type: integer, minimum: 0, maximum: 2 }
        explanation: { type: string, minLength: 1, maxLength: 800 }
        feedback_wrong: { type: string, minLength: 1, maxLength: 400 }
        followup_question: { type: string, minLength: 1, maxLength: 700 }
        followup_options: { type: array, minItems: 2, maxItems: 3, items: { type: string, minLength: 1, maxLength: 400 } }
        followup_correct_index: { type: integer, minimum: 0, maximum: 2 }
        followup_explanation: { type: string, minLength: 1, maxLength: 800 }
        followup_feedback_wrong: { type: string, minLength: 1, maxLength: 400 }
      required: [committee_question, options, correct_index, explanation, feedback_wrong, followup_question, followup_options, followup_correct_index, followup_explanation, followup_feedback_wrong]