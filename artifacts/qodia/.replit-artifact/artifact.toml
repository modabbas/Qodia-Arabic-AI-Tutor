kind = "web"
previewPath = "/"
title = "Qodia"
description = "An Arabic RTL learning app that helps computer science students prepare for their graduation project defense with focused, interactive five-touch sessions."
version = "1.0.0"
id = "artifacts/qodia"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21616

[services.development]
run = "pnpm --filter @workspace/qodia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qodia", "run", "build" ]
serve = "static"
publicDir = "artifacts/qodia/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21616"
BASE_PATH = "/"
